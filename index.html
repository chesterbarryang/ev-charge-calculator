<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Smart Charging Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased font-sans p-6">

    <audio id="silent-bg-player" loop src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABmYWN0BAAAAAAAAABkYXRhAAAAAA=="></audio>

    <div class="max-w-md mx-auto w-full space-y-6">
        <header class="border-b border-slate-800 pb-4 space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-emerald-400">EV Dashboard</h1>
                    <p class="text-xs text-slate-400">Modular Utility Management Platform</p>
                </div>
                <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1 text-xs font-medium text-emerald-400">LiFePO4</div>
            </div>
            
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Active Vehicle Profile</label>
                <select id="vehicle-brand" class="bg-slate-900 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-2.5 outline-none focus:border-emerald-500 font-medium cursor-pointer"></select>
            </div>
        </header>

        <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-800">
            <button id="btn-soc" onclick="setMode('soc')" class="flex-1 py-2 text-sm rounded-lg bg-emerald-500 text-slate-950 font-semibold transition cursor-pointer">Option 1: Target SoC (%)</button>
            <button id="btn-budget" onclick="setMode('budget')" class="flex-1 py-2 text-sm rounded-lg text-slate-400 transition cursor-pointer">Option 2: Budget (₱)</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-5 shadow-xl">
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-300">Beginning SoC (%)</label>
                    <input type="number" id="current-soc" min="0" max="100" value="20" class="w-16 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-sm outline-none text-emerald-400 font-bold focus:border-emerald-500">
                </div>
                <input type="range" id="slider-current" min="0" max="100" value="20" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
            </div>

            <hr class="border-slate-800/50">

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label id="target-input-label" class="text-sm font-medium text-slate-300">Target SoC (%)</label>
                    <input type="number" id="target-value" min="0" value="80" class="w-20 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-sm outline-none text-emerald-400 font-bold focus:border-emerald-500">
                </div>
                <input type="range" id="slider-target" min="0" max="100" value="80" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
            </div>

            <div id="lfp-guidance-banner" class="text-xs rounded-xl p-3 border font-medium transition-all duration-300"></div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Network Grid</label>
                    <select id="charger-network" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="evro">EVro Commercial</option>
                        <option value="home">Home Base Outlet</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Station Outlet Power</label>
                    <select id="charger-type" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500 cursor-pointer"></select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Cost (PHP / kWh)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-sm">₱</span>
                        <input type="number" id="rate" step="0.1" value="28.5" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full pl-7 p-3 outline-none focus:border-emerald-500">
                    </div>
                    <div class="flex gap-1 mt-1.5">
                        <button onclick="setQuickRate(13.0)" class="text-[10px] bg-slate-950 border border-slate-800 text-slate-400 rounded p-1 flex-1 hover:text-emerald-400 transition cursor-pointer">Home</button>
                        <button onclick="setQuickRate(28.5)" class="text-[10px] bg-slate-950 border border-slate-800 text-slate-400 rounded p-1 flex-1 hover:text-emerald-400 transition cursor-pointer">EVro</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Loss Factor Multiplier</label>
                    <select id="efficiency" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="1.0">0% (Direct Link)</option>
                        <option value="1.05">5% Efficiency Loss</option>
                        <option value="1.10" selected>10% Standard AC</option>
                        <option value="1.15">15% High Heat Loss</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Session Start Time</label>
                <button onclick="initTime()" class="text-xs text-emerald-400 font-medium bg-emerald-500/10 border border-emerald-500/20 rounded-lg px-2 py-1 hover:bg-emerald-500/20 transition cursor-pointer">Reset to Now</button>
            </div>
            <input type="time" id="plug-time" class="bg-slate-950 border border-slate-800 text-slate-200 font-bold text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500">
        </div>

        <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm rounded-xl p-3 text-center font-medium">Target must exceed current baseline SoC parameters.</div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <p class="text-xs text-slate-400 font-medium mb-1">Energy Added (Net)</p>
                    <p id="result-energy" class="text-xl font-bold text-slate-100">-- <span class="text-xs font-normal text-slate-400">kWh</span></p>
                </div>
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <p id="label-cost-or-soc" class="text-xs text-slate-400 font-medium mb-1">Total Session Cost</p>
                    <p id="result-cost-or-soc" class="text-xl font-bold text-emerald-400">₱ --</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50 flex flex-col justify-center items-center py-3">
                    <p class="text-xs text-slate-400 font-medium mb-1">Estimated Duration</p>
                    <p id="result-time" class="text-xl font-bold text-slate-100 tracking-tight">--</p>
                </div>
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50 flex flex-col justify-center items-center py-3">
                    <p class="text-xs text-emerald-400 font-medium mb-1">⏰ Ready At</p>
                    <p id="result-clock" class="text-xl font-black text-emerald-400 tracking-tight">--</p>
                </div>
            </div>

            <div id="timer-control-block" class="pt-2">
                <button id="btn-timer-toggle" onclick="toggleActiveTimer()" class="w-full bg-emerald-500 text-slate-950 font-bold text-sm p-3.5 rounded-xl transition duration-200 opacity-50 cursor-not-allowed" disabled>⏱️ Start Session Alarm Clock</button>
            </div>
        </div>

        <div class="text-center pt-2">
            <button onclick="toggleMaintenanceModal(true)" class="text-xs text-slate-500 underline hover:text-slate-400 cursor-pointer">🛠️ Open Registry Maintenance Facility</button>
        </div>
    </div>

    <div id="maintenance-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h2 class="text-base font-bold text-emerald-400">Registry Maintenance</h2>
                <button onclick="toggleMaintenanceModal(false)" class="text-slate-400 hover:text-slate-200 text-sm cursor-pointer font-bold">✕</button>
            </div>

            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Register Custom Vehicle Model</h3>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="m-veh-brand" placeholder="Brand (e.g. BYD)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
                    <input type="text" id="m-veh-name" placeholder="Model (e.g. Dolphin)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="m-veh-cap" placeholder="Pack Capacity (kWh)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
                    <select id="m-veh-type" class="bg-slate-950 border border-slate-800 text-slate-400 text-xs rounded-xl p-2.5 outline-none focus:border-emerald-500">
                        <option value="AC_DC">AC & DC Compatible</option>
                        <option value="DC">Strictly DC Only</option>
                    </select>
                </div>
                <button onclick="commitCustomVehicle()" class="w-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold p-2 rounded-xl hover:bg-emerald-500/20 transition cursor-pointer">Save New Vehicle Profile</button>
            </div>

            <hr class="border-slate-800">

            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Register Custom Terminal Output</h3>
                <select id="m-net-target" class="bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-xl p-2.5 w-full outline-none focus:border-emerald-500">
                    <option value="home">Add to Home Base Profile</option>
                    <option value="evro">Add to EVro Commercial Network</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="m-speed-label" placeholder="Label (e.g. Shell Ultra)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
                    <input type="number" id="m-speed-kw" step="0.1" placeholder="Power Output (kW)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="m-speed-type" class="bg-slate-950 border border-slate-800 text-slate-400 text-xs rounded-xl p-2.5 w-full outline-none focus:border-emerald-500">
                        <option value="AC">AC Current</option>
                        <option value="DC">DC Current</option>
                    </select>
                    <button onclick="commitCustomSpeedOutlet()" class="w-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold p-2 rounded-xl hover:bg-emerald-500/20 transition cursor-pointer">Save Terminal Speed</button>
                </div>
            </div>
            
            <div class="pt-2 border-t border-slate-800/50 flex justify-end">
                <button onclick="clearCustomRegistries()" class="text-[10px] text-rose-400 bg-rose-500/5 px-2 py-1 rounded border border-rose-500/10 hover:bg-rose-500/10 transition cursor-pointer">⚠️ Reset Custom Data Registries</button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
