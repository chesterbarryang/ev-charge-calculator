<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetour T1 i-DM Advanced Calc</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased font-sans p-6">

    <div class="max-w-md mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-emerald-400">Jetour T1 i-DM</h1>
                <p class="text-xs text-slate-400">Smart Reverse Charging Calculator (26.7 kWh)</p>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1 text-xs font-medium text-emerald-400">
                LiFePO4
            </div>
        </header>

        <!-- Mode Toggle -->
        <div class="flex bg-slate-900 rounded-xl p-1 border border-slate-800">
            <button id="btn-soc" onclick="setMode('soc')" class="flex-1 py-2 text-sm rounded-lg bg-emerald-500 text-slate-950 font-semibold transition-all duration-200 cursor-pointer">
                Option 1: Target SoC (%)
            </button>
            <button id="btn-budget" onclick="setMode('budget')" class="flex-1 py-2 text-sm rounded-lg text-slate-400 transition-all duration-200 cursor-pointer">
                Option 2: Budget Amount (₱)
            </button>
        </div>

        <!-- Core Inputs Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-5 shadow-xl">
            <!-- Common: Beginning SoC -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-300">Beginning SoC (%)</label>
                    <input type="number" id="current-soc" min="0" max="100" value="20" class="w-16 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-sm outline-none text-emerald-400 font-bold focus:border-emerald-500">
                </div>
                <input type="range" id="slider-current" min="0" max="100" value="20" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
            </div>

            <hr class="border-slate-800/50">

            <!-- Dynamic Input Area -->
            <div id="dynamic-target-container" class="space-y-2">
                <!-- Content injected dynamically by JS -->
            </div>

            <!-- LFP Protection Banner Area -->
            <div id="lfp-guidance-banner" class="text-xs rounded-xl p-3 border font-medium transition-all duration-300">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Time Optimization Configuration Block -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Session Start Time</label>
                <button onclick="setToCurrentTime()" class="text-xs text-emerald-400 font-medium bg-emerald-500/10 border border-emerald-500/20 rounded-lg px-2 py-1 hover:bg-emerald-500/20 transition cursor-pointer">Reset to Now</button>
            </div>
            <input type="time" id="plug-time" class="bg-slate-950 border border-slate-800 text-slate-200 font-bold text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500">
        </div>

        <!-- Hardware & Utility Config Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Charger Power Output</label>
                <select id="charger-type" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500">
                    <option value="3.3">3.3 kW Portable AC</option>
                    <option value="6.81" selected>6.8 kW Real-World AC (EVro)</option>
                    <option value="22.0">22.0 kW AC Destination</option>
                    <option value="50.0">50.0 kW Public DC Fast Charger</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Rate (PHP / kWh)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-sm">₱</span>
                        <input type="number" id="rate" step="0.1" value="28.5" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full pl-7 p-3 outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Loss Overhead</label>
                    <select id="efficiency" class="bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl block w-full p-3 outline-none focus:border-emerald-500">
                        <option value="1.0">0% (Direct Reading)</option>
                        <option value="1.05">5% Efficiency Loss</option>
                        <option value="1.10" selected>10% Standard AC Loss</option>
                        <option value="1.15">15% High Heat Loss</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Alert Error Banner -->
        <div id="error-msg" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm rounded-xl p-3 text-center font-medium">
            Target SoC must be strictly greater than your Beginning SoC.
        </div>

        <!-- Session Result Projections Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-3xl -mr-5 -mt-5"></div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Calculated Metrics</h3>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <p class="text-xs text-slate-400 font-medium mb-1">Energy Added (Net)</p>
                    <p id="result-energy" class="text-xl font-bold text-slate-100">-- <span class="text-xs font-normal text-slate-400">kWh</span></p>
                </div>
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <p id="label-cost-or-soc" class="text-xs text-slate-400 font-medium mb-1">Total Session Cost</p>
                    <p id="result-cost-or-soc" class="text-xl font-bold text-emerald-400">₱ --</p>
                </div>
            </div>

            <!-- Duration & Clock Projections -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50 flex flex-col justify-center items-center py-3">
                    <p class="text-xs text-slate-400 font-medium mb-1">Estimated Duration</p>
                    <p id="result-time" class="text-xl font-bold text-slate-100 tracking-tight">--</p>
                </div>
                <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50 flex flex-col justify-center items-center py-3">
                    <p class="text-xs text-emerald-400 font-medium mb-1">⏰ Ready At</p>
                    <p id="result-clock" class="text-xl font-black text-emerald-400 tracking-tight">--</p>
                </div>
            </div>

            <!-- New Integrated Zero-Clutter Timer Container Control Block -->
            <div id="timer-control-block" class="pt-2">
                <button id="btn-timer-toggle" onclick="toggleActiveTimer()" class="w-full bg-emerald-500 text-slate-950 font-bold text-sm p-3.5 rounded-xl transition duration-200 opacity-50 cursor-not-allowed" disabled>
                    ⏱️ Start Session Alarm Clock
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'soc'; 
        const batteryCapacity = 26.7;

        const currentSocInput = document.getElementById('current-soc');
        const sliderCurrent = document.getElementById('slider-current');
        const chargerTypeSelect = document.getElementById('charger-type');
        const rateInput = document.getElementById('rate');
        const efficiencySelect = document.getElementById('efficiency');
        const plugTimeInput = document.getElementById('plug-time');
        const dynamicContainer = document.getElementById('dynamic-target-container');
        const errorMsg = document.getElementById('error-msg');
        const lfpBanner = document.getElementById('lfp-guidance-banner');
        const btnTimerToggle = document.getElementById('btn-timer-toggle');

        const resultEnergy = document.getElementById('result-energy');
        const labelCostOrSoc = document.getElementById('label-cost-or-soc');
        const resultCostOrSoc = document.getElementById('result-cost-or-soc');
        const resultTime = document.getElementById('result-time');
        const resultClock = document.getElementById('result-clock');

        let targetSocValue = 80;
        let budgetAmountValue = 500;
        
        // Native Alarm State Tracking Variables
        let timerInterval = null;
        let audioContext = null;
        let alarmOscillator = null;
        let alarmInterval = null;
        let targetTotalSecondsLeft = 0;
        let isTimerRunning = false;

        function setToCurrentTime() {
            if(isTimerRunning) return; // Prevent overwriting active countdown anchors
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            plugTimeInput.value = `${hours}:${minutes}`;
            calculate();
        }

        function setMode(mode) {
            if (isTimerRunning) return; 
            currentMode = mode;
            const bSoc = document.getElementById('btn-soc');
            const bBud = document.getElementById('btn-budget');
            if (mode === 'soc') {
                bSoc.className = "flex-1 py-2 text-sm rounded-lg bg-emerald-500 text-slate-950 font-semibold transition-all duration-200 cursor-pointer";
                bBud.className = "flex-1 py-2 text-sm rounded-lg text-slate-400 transition-all duration-200 cursor-pointer";
            } else {
                bSoc.className = "flex-1 py-2 text-sm rounded-lg text-slate-400 transition-all duration-200 cursor-pointer";
                bBud.className = "flex-1 py-2 text-sm rounded-lg bg-emerald-500 text-slate-950 font-semibold transition-all duration-200 cursor-pointer";
            }
            renderDynamicInputs();
            calculate();
        }

        function renderDynamicInputs() {
            if (currentMode === 'soc') {
                dynamicContainer.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-slate-300">Target SoC (%)</label>
                            <input type="number" id="target-soc" min="0" max="100" value="${targetSocValue}" class="w-16 bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-center text-sm outline-none text-emerald-400 font-bold focus:border-emerald-500">
                        </div>
                        <input type="range" id="slider-target" min="0" max="100" value="${targetSocValue}" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>`;
                
                const targetSocInput = document.getElementById('target-soc');
                const sliderTarget = document.getElementById('slider-target');

                targetSocInput.addEventListener('input', (e) => {
                    targetSocValue = Math.min(100, Math.max(0, parseInt(e.target.value) || 0));
                    sliderTarget.value = targetSocValue;
                    calculate();
                });
                sliderTarget.addEventListener('input', (e) => {
                    targetSocValue = parseInt(e.target.value);
                    targetSocInput.value = targetSocValue;
                    calculate();
                });
            } else {
                dynamicContainer.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-slate-300">Target Budget Cash Allocation</label>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 font-bold text-sm">₱</span>
                            <input type="number" id="budget-amount" value="${budgetAmountValue}" step="10" class="bg-slate-950 border border-slate-800 text-slate-100 font-bold text-base rounded-xl block w-full pl-9 p-3.5 outline-none focus:border-emerald-500" placeholder="Enter target amount">
                        </div>
                    </div>`;

                const budgetAmountInput = document.getElementById('budget-amount');
                budgetAmountInput.addEventListener('input', (e) => {
                    budgetAmountValue = Math.max(0, parseFloat(e.target.value) || 0);
                    calculate();
                });
            }
        }

        currentSocInput.addEventListener('input', (e) => {
            if(isTimerRunning) return;
            let val = Math.min(100, Math.max(0, parseInt(e.target.value) || 0));
            sliderCurrent.value = val;
            calculate();
        });
        sliderCurrent.addEventListener('input', (e) => {
            if(isTimerRunning) return;
            currentSocInput.value = e.target.value;
            calculate();
        });

        [chargerTypeSelect, rateInput, efficiencySelect, plugTimeInput].forEach(element => {
            element.addEventListener('input', () => {
                if(!isTimerRunning) calculate();
            });
        });

        function updateLFPMetrics(finalEstimatedSoC) {
            if (finalEstimatedSoC >= 100) {
                lfpBanner.className = "text-xs rounded-xl p-3 border font-medium transition-all duration-300 bg-emerald-500/10 border-emerald-500/20 text-emerald-400";
                lfpBanner.textContent = "✓ LFP Compliant: Regular 100% saturation calibrates your pack cells and keeps the BMS accurate.";
            } else {
                lfpBanner.className = "text-xs rounded-xl p-3 border font-medium transition-all duration-300 bg-amber-500/10 border-amber-500/20 text-amber-400";
                lfpBanner.textContent = "ℹ LFP Tip: You are topping off to " + finalEstimatedSoC.toFixed(0) + "%. Ensure you charge to 100% at least once a week to prevent cell variance.";
            }
        }

        function calculate() {
            if (isTimerRunning) return;

            const currentSoc = parseFloat(currentSocInput.value) || 0;
            const chargerSpeed = parseFloat(chargerTypeSelect.value);
            const rate = parseFloat(rateInput.value) || 0;
            const lossMultiplier = parseFloat(efficiencySelect.value);

            errorMsg.classList.add('hidden');
            btnTimerToggle.className = "w-full bg-emerald-500 text-slate-950 font-bold text-sm p-3.5 rounded-xl transition duration-200 cursor-pointer hover:bg-emerald-400";
            btnTimerToggle.disabled = false;
            btnTimerToggle.textContent = "⏱️ Start Session Alarm Clock";

            let estimatedHours = 0;
            let targetSoCResult = currentSoc;

            if (currentMode === 'soc') {
                labelCostOrSoc.textContent = "Total Session Cost";
                targetSoCResult = targetSocValue;
                
                if (targetSocValue <= currentSoc) {
                    errorMsg.classList.remove('hidden');
                    resetOutputs();
                    updateLFPMetrics(currentSoc);
                    return;
                }

                const deltaSoC = (targetSocValue - currentSoc) / 100;
                const netEnergyNeeded = deltaSoC * batteryCapacity;
                
                const totalDispensedEnergy = netEnergyNeeded * lossMultiplier;
                const totalCost = Math.round(totalDispensedEnergy * rate * 100) / 100;
                estimatedHours = totalDispensedEnergy / chargerSpeed;

                renderCalculatedDOM(netEnergyNeeded, `₱${totalCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`);

            } else {
                labelCostOrSoc.textContent = "Calculated Target SoC";

                if (rate <= 0 || budgetAmountValue <= 0) {
                    resetOutputs();
                    resultCostOrSoc.textContent = `${currentSoc}%`;
                    updateLFPMetrics(currentSoc);
                    return;
                }

                const totalDispensedEnergyAllowed = budgetAmountValue / rate;
                const netEnergyToBattery = totalDispensedEnergyAllowed / lossMultiplier;
                const addedSoCPercent = (netEnergyToBattery / batteryCapacity) * 100;
                targetSoCResult = currentSoc + addedSoCPercent;

                let trueDispensedEnergy = totalDispensedEnergyAllowed;
                estimatedHours = totalDispensedEnergyAllowed / chargerSpeed;

                if (targetSoCResult > 100) {
                    targetSoCResult = 100;
                    const maxPossibleDelta = (100 - currentSoc) / 100;
                    const maxNetEnergy = maxPossibleDelta * batteryCapacity;
                    
                    trueDispensedEnergy = maxNetEnergy * lossMultiplier;
                    estimatedHours = trueDispensedEnergy / chargerSpeed;
                    
                    const actualCappedCost = Math.round(trueDispensedEnergy * rate * 100) / 100;
                    labelCostOrSoc.innerHTML = `Target SoC <span class="text-xs text-rose-400 block font-normal">(Capped at 100% Full, Spend: ₱${actualCappedCost.toFixed(2)})</span>`;
                }

                const finalNetEnergyAdded = trueDispensedEnergy / lossMultiplier;
                renderCalculatedDOM(finalNetEnergyAdded, `${targetSoCResult.toFixed(1)}%`);
            }

            updateLFPMetrics(targetSoCResult);

            const totalMinutes = Math.round(estimatedHours * 60);
            targetTotalSecondsLeft = totalMinutes * 60; // Map directly into code tracking layers

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            
            let timeString = '';
            if (hours > 0) timeString += `${hours}h `;
            timeString += `${minutes}m`;
            resultTime.textContent = timeString;

            const plugTimeValue = plugTimeInput.value || "00:00";
            const [startHours, startMinutes] = plugTimeValue.split(':').map(Number);
            
            const targetDate = new Date();
            targetDate.setHours(startHours);
            targetDate.setMinutes(startMinutes + totalMinutes);
            targetDate.setSeconds(0);
            
            let clockHours = targetDate.getHours();
            const clockMinutes = targetDate.getMinutes().toString().padStart(2, '0');
            const ampm = clockHours >= 12 ? 'PM' : 'AM';
            clockHours = clockHours % 12;
            clockHours = clockHours ? clockHours : 12; 
            
            resultClock.textContent = `${clockHours}:${clockMinutes} ${ampm}`;
        }

        // Native Browser Audio Alert Engine Implementation 
        function toggleActiveTimer() {
            if (isTimerRunning) {
                // Cancel active timers manually
                clearInterval(timerInterval);
                stopAudioAlarmEngine();
                isTimerRunning = false;
                calculate();
            } else {
                if (targetTotalSecondsLeft <= 0) return;
                
                // Initialize web sound contexts to bypass browser autoplay protections
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                isTimerRunning = true;
                btnTimerToggle.textContent = "🛑 Cancel Session Alarm";
                btnTimerToggle.className = "w-full bg-rose-600 text-slate-100 font-bold text-sm p-3.5 rounded-xl transition duration-200 cursor-pointer hover:bg-rose-500";

                timerInterval = setInterval(() => {
                    targetTotalSecondsLeft--;

                    if (targetTotalSecondsLeft <= 0) {
                        clearInterval(timerInterval);
                        triggerAudioAlarmEngine();
                    } else {
                        // Dynamically countdown in results duration window area
                        const h = Math.floor(targetTotalSecondsLeft / 3600);
                        const m = Math.floor((targetTotalSecondsLeft % 3600) / 60);
                        const s = targetTotalSecondsLeft % 60;
                        resultTime.textContent = `${h > 0 ? h + 'h ' : ''}${m}m ${s}s left`;
                    }
                }, 1000);
            }
        }

        function triggerAudioAlarmEngine() {
            btnTimerToggle.textContent = "🔕 Silence Alarm Notification";
            btnTimerToggle.className = "w-full bg-amber-500 text-slate-950 font-black text-sm p-4 rounded-xl animate-pulse cursor-pointer";
            resultTime.textContent = "⚡ CHARGING COMPLETE!";

            // Loop an synth beep cadence using standard browser audio frequencies
            alarmInterval = setInterval(() => {
                if (!audioContext) return;
                
                let osc = audioContext.createOscillator();
                let gain = audioContext.createGain();
                
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, audioContext.currentTime); // High clear A5 note frequency 
                
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4); // Clean ring drop
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            }, 1000);
        }

        function stopAudioAlarmEngine() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function renderCalculatedDOM(energy, alternateCostSocText) {
            resultEnergy.innerHTML = `${energy.toFixed(2)} <span class="text-xs font-normal text-slate-400">kWh</span>`;
            resultCostOrSoc.textContent = alternateCostSocText;
        }

        function resetOutputs() {
            resultEnergy.innerHTML = `-- <span class="text-xs font-normal text-slate-400">kWh</span>`;
            resultCostOrSoc.textContent = `₱ --`;
            resultTime.textContent = `--`;
            resultClock.textContent = `--`;
            btnTimerToggle.className = "w-full bg-slate-800 text-slate-500 font-bold text-sm p-3.5 rounded-xl transition duration-200 opacity-50 cursor-not-allowed";
            btnTimerToggle.disabled = true;
        }

        setToCurrentTime();
        setMode('soc');
    </script>
</body>
</html>
